name: AP09 Namespace Probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Probe deployment account namespace
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SFTP_HOST }}
          port: ${{ secrets.SFTP_PORT }}
          username: ${{ secrets.SFTP_USER }}
          password: ${{ secrets.SFTP_PASS }}
          timeout: 30s
          command_timeout: 60s
          script: |
            set -e
            echo "AP09_NAMESPACE_PROBE=START"
            echo "REMOTE_USER=$(whoami)"
            echo "REMOTE_PWD=$(pwd -P)"

            if [ -d /home/potrzebuje/public_html/3pillars ]; then
              echo "ABSOLUTE_3PILLARS_EXISTS=YES"
              cd /home/potrzebuje/public_html/3pillars
              echo "ABSOLUTE_3PILLARS_REALPATH=$(pwd -P)"
            else
              echo "ABSOLUTE_3PILLARS_EXISTS=NO"
            fi

            cd "$HOME"
            if [ -d public_html/3pillars ]; then
              echo "HOME_RELATIVE_3PILLARS_EXISTS=YES"
              cd public_html/3pillars
              echo "HOME_RELATIVE_3PILLARS_REALPATH=$(pwd -P)"
            else
              echo "HOME_RELATIVE_3PILLARS_EXISTS=NO"
            fi

            echo "FILES_WRITTEN=0"
            echo "AP09_NAMESPACE_PROBE=PASS"
